<!DOCTYPE html>
<html>
<head>
  <title>Transaction History</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght@500&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f4f9f4;
      color: #1b5e20;
      margin: 0;
      padding: 0;
    }

    header {
      width: 100%;
      background-color: #1b5e20;
      color: #fff;
      text-align: center;
      font-family: 'Montserrat', sans-serif;
      font-size: 28px;
      padding: 20px 0;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .container {
      width: 90%;
      max-width: 900px;
      margin: 30px auto;
      background-color: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      margin-bottom: 25px;
      color: #1b5e20;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    th, td {
      padding: 14px 15px;
      text-align: center;
      border-bottom: 1px solid #c1e1c1;
    }

    th {
      background-color: #e6f5ea;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
    }

    tr:hover {
      background-color: #f0f8f0;
    }

    .points-earned {
      color: #2e7d32;
      font-weight: 700;
    }

    .points-spent {
      color: #c62828;
      font-weight: 700;
    }

    .no-data {
      text-align: center;
      padding: 40px 20px;
      color: #666;
      font-style: italic;
    }

    button {
      padding: 12px 25px;
      background-color: #1b5e20;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #2e7d32;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

<header>📝 Transaction History</header>

<div class="container">
  <h2>Your Transactions</h2>
  <table id="historyTable">
    <thead>
      <tr>
        <th>Date & Time</th>
        <th>Type</th>
        <th>Details</th>
        <th>Points</th>
      </tr>
    </thead>
    <tbody>
      <!-- Transactions will be loaded here -->
    </tbody>
  </table>

  <button onclick="goBack()">⬅ Back to Home</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCX2O4EFo1U6QYAlybBHJC-UqMAEqCtyDs",
  authDomain: "plastic-waste-management-b4db5.firebaseapp.com",
  databaseURL: "https://plastic-waste-management-b4db5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "plastic-waste-management-b4db5",
  storageBucket: "plastic-waste-management-b4db5.firebasestorage.app",
  messagingSenderId: "1048380462925",
  appId: "1:1048380462925:web:824ff7306ab3382793c904"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();
let currentUser = null;

// Load Transaction History - FIXED & SIMPLIFIED
async function loadHistory() {
  const tableBody = document.getElementById('historyTable').querySelector('tbody');
  tableBody.innerHTML = '<tr><td colspan="4" class="no-data">Loading transactions...</td></tr>';

  try {
    if (!currentUser) {
      tableBody.innerHTML = '<tr><td colspan="4" class="no-data">Please login first.</td></tr>';
      return;
    }

    const snapshot = await db.collection("transactions")
  .where("uid", "==", currentUser.uid)
  .get();

    tableBody.innerHTML = "";

    if (snapshot.empty) {
      tableBody.innerHTML = `
        <tr>
          <td colspan="4" class="no-data">No transactions yet.<br>Submit plastic or buy items to see history.</td>
        </tr>`;
      return;
    }

    snapshot.forEach(doc => {
      const data = doc.data();
      const transactionTime = data.time ? data.time.toDate() : new Date();

      const typeDisplay = data.type === "plastic" ? "♻️ Plastic Submission" : "🛒 Item Purchased";
      
      const pointsClass = data.pointsChange > 0 ? 'points-earned' : 'points-spent';
      const pointsDisplay = data.pointsChange > 0 
        ? `+${data.pointsChange}` 
        : `${data.pointsChange}`;

      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${transactionTime.toLocaleString()}</td>
        <td>${typeDisplay}</td>
        <td>${data.details || data.item || "-"}</td>
        <td class="${pointsClass}">${pointsDisplay}</td>
      `;
      tableBody.appendChild(row);
    });

  } catch (error) {
    console.error("Error loading history:", error);
    tableBody.innerHTML = `
      <tr>
        <td colspan="4" class="no-data" style="color: red;">
          Failed to load transactions.<br>Please try again.
        </td>
      </tr>`;
  }
}

// Auth State Listener
auth.onAuthStateChanged(user => {
  if (!user) {
    window.location.href = "login.html";
  } else {
    currentUser = user;
    loadHistory();        // Load history once user is authenticated
  }
});

// Back Button
function goBack() {
  window.location.href = "index.html";
}
</script>

</body>
</html>
