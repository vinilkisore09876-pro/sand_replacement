<!DOCTYPE html>
<html>
<head>
  <title>🧭 Your Location - EcoBin</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f4f9f4;
      color: #1b5e20;
      margin: 0;
      padding: 0;
    }
    header {
      width: 100%;
      background-color: #1b5e20;
      color: white;
      text-align: center;
      font-family: 'Montserrat', sans-serif;
      font-size: 28px;
      padding: 20px 0;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .container {
      width: 90%;
      max-width: 600px;
      margin: 40px auto;
      background-color: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }
    button {
      padding: 14px 30px;
      background-color: #1b5e20;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      margin: 20px 0;
    }
    button:hover {
      background-color: #2e7d32;
    }
    #status {
      margin: 20px 0;
      font-size: 16px;
      font-weight: 500;
    }
    .success { color: #2e7d32; }
    .error { color: #c62828; }
  </style>
</head>
<body>

<header>🧭 Your Current Location</header>

<div class="container">
  <h2>Share Your Live Location</h2>
  <p>This will help us track nearby plastic collection points or vehicle status.</p>

  <button onclick="getAndSaveLocation()">📍 Get & Save My Location</button>

  <div id="status"></div>

  <button onclick="goBack()">⬅ Back to Home</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCX2O4EFo1U6QYAlybBHJC-UqMAEqCtyDs",
  authDomain: "plastic-waste-management-b4db5.firebaseapp.com",
  projectId: "plastic-waste-management-b4db5",
  storageBucket: "plastic-waste-management-b4db5.firebasestorage.app",
  messagingSenderId: "1048380462925",
  appId: "1:1048380462925:web:824ff7306ab3382793c904"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();
let currentUser = null;

auth.onAuthStateChanged(user => {
  if (!user) {
    window.location.href = "login.html";
  } else {
    currentUser = user;
  }
});

async function getAndSaveLocation() {
  const statusDiv = document.getElementById("status");
  statusDiv.innerHTML = "🔄 Getting your location... <br>Please allow location access when prompted.";

  if (!navigator.geolocation) {
    statusDiv.innerHTML = `<span class="error">❌ Your browser does not support location.</span>`;
    return;
  }

  navigator.geolocation.getCurrentPosition(
    async (position) => {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      statusDiv.innerHTML = `✅ Location detected!<br>Lat: ${lat.toFixed(5)}<br>Lon: ${lng.toFixed(5)}<br>Saving to database...`;

      try {
        await db.collection("userLocations").add({
          uid: currentUser.uid,
          email: currentUser.email,
          location: new firebase.firestore.GeoPoint(lat, lng),
          accuracy: position.coords.accuracy,
          timestamp: new Date()
        });

        // Update latest location in users collection
        await db.collection("users").doc(currentUser.uid).set({
          lastLocation: new firebase.firestore.GeoPoint(lat, lng),
          lastLocationTime: new Date()
        }, { merge: true });

        statusDiv.innerHTML = `<span class="success">🎉 Location saved successfully in Firebase!</span>`;

      } catch (err) {
        console.error(err);
        statusDiv.innerHTML = `<span class="error">❌ Failed to save to database.</span>`;
      }
    },

    (error) => {
      let message = "";
      switch(error.code) {
        case error.PERMISSION_DENIED:
          message = `❌ Location access was denied.<br><br>
            <strong>How to fix:</strong><br>
            1. Click the lock 🔒 icon in address bar<br>
            2. Change Location to <strong>Allow</strong><br>
            3. Then click "Try Again" below`;
          break;
        case error.POSITION_UNAVAILABLE:
          message = "❌ Location information is unavailable.";
          break;
        case error.TIMEOUT:
          message = "❌ Location request timed out. Try again.";
          break;
        default:
          message = "❌ Unknown error occurred.";
      }
      statusDiv.innerHTML = `
        <span class="error">${message}</span><br><br>
        <button onclick="getAndSaveLocation()" style="padding:10px 20px;">🔄 Try Again</button>
      `;
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}
function goBack() {
  window.location.href = "index.html";
}
</script>

</body>
</html>
