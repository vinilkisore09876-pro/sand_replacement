<!DOCTYPE html>
<html>
<head>
  <title>Login - EcoBin</title>
  <link rel="stylesheet" href="stylelogin.css">
</head>
<body>

<div class="container">
  <h1>EcoBin</h1>

  <!-- LOGIN FORM -->
  <h2>Login</h2>
  <input type="email" id="login-email" placeholder="Enter your email">
  <input type="password" id="login-password" placeholder="Enter your password">
  <button id="loginBtn">Login</button>
  <p id="loginError"></p>

  <p style="text-align:center; margin-top:15px; color:#ffdd00;">
    Don't have an account? 
    <button id="goSignup" style="background:none; border:none; color:#ff4e4e; cursor:pointer; font-weight:bold;">
      Create Account
    </button>
  </p>
</div>

<!-- Firebase scripts -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCX2O4EFo1U6QYAlybBHJC-UqMAEqCtyDs",
    authDomain: "plastic-waste-management-b4db5.firebaseapp.com",
    databaseURL: "https://plastic-waste-management-b4db5-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "plastic-waste-management-b4db5",
    storageBucket: "plastic-waste-management-b4db5.firebasestorage.app",
    messagingSenderId: "1048380462925",
    appId: "1:1048380462925:web:824ff7306ab3382793c904"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  // LOGIN
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');

  loginBtn.addEventListener('click', () => {
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;

    auth.signInWithEmailAndPassword(email, password)
      .then(() => {
        window.location.href = "index.html"; // redirect after login
      })
      .catch((error) => {
        loginError.textContent = error.message;
      });
  });

  // Redirect to signup page
  document.getElementById('goSignup').addEventListener('click', () => {
    window.location.href = "signup.html";
  });
</script>

</body>
</html>
