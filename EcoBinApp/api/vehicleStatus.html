<!DOCTYPE html>
<html>
<head>
  <title>Vehicle Status</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f4f9f4;
      color: #1b5e20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    header {
      width: 100%;
      background-color: #1b5e20;
      color: white;
      text-align: center;
      font-family: 'Montserrat', sans-serif;
      font-size: 28px;
      padding: 20px 0;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      margin-bottom: 30px;
    }

    .status-card {
      background-color: #e6f5ea;
      padding: 25px 40px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      font-size: 20px;
      text-align: center;
      max-width: 400px;
    }

    .status-badge {
      display: inline-block;
      margin-top: 15px;
      padding: 8px 15px;
      border-radius: 12px;
      font-weight: 600;
      color: white;
    }

    .connected {
      background-color: #2e7d32; /* green */
    }

    .disconnected {
      background-color: #c62828; /* red */
    }
  </style>
</head>
<body>

<header>🚚 Vehicle Status</header>

<div class="status-card">
  Vehicle Tracking is currently <span id="statusText" class="status-badge disconnected">Not Connected</span>
  <p style="margin-top:15px;">Once GPS tracker is installed, live vehicle location will appear here.</p>
</div>

<script>
  // Mock vehicle status logic
  // Later you can replace with actual Firebase or GPS data
  const statusText = document.getElementById('statusText');

  // Example: toggle vehicle status every 5 seconds (just for demo)
  let connected = false;
  setInterval(() => {
    connected = !connected;
    if (connected) {
      statusText.innerText = "Connected";
      statusText.classList.remove("disconnected");
      statusText.classList.add("connected");
    } else {
      statusText.innerText = "Not Connected";
      statusText.classList.remove("connected");
      statusText.classList.add("disconnected");
    }
  }, 5000);
</script>

</body>
</html>
