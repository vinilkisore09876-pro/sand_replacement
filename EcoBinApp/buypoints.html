<!DOCTYPE html>
<html>
<head>
  <title>Buy for Points</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f4f9f4;
      color: #1b5e20;
      margin: 0;
      padding: 0;
    }

    header {
      width: 100%;
      background-color: #1b5e20;
      color: white;
      text-align: center;
      font-family: 'Montserrat', sans-serif;
      font-size: 28px;
      padding: 20px 0;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .points-display {
      text-align: center;
      font-size: 20px;
      margin: 20px 0;
      font-weight: 600;
    }

    .container {
      width: 90%;
      max-width: 900px;
      margin: 30px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .item-card {
      background-color: #e6f5ea;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
      padding: 15px;
      text-align: center;
      transition: 0.3s;
      cursor: pointer;
    }

    .item-card:hover {
      background-color: #c8e6c9;
      transform: translateY(-3px);
    }

    .item-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .item-card h4 {
      margin: 5px 0;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
    }

    .item-card p {
      margin: 5px 0;
      font-weight: 500;
    }

    .buy-btn {
      padding: 8px 15px;
      background-color: #1b5e20;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      font-weight: 600;
      transition: 0.3s;
    }

    .buy-btn:hover {
      background-color: #2e7d32;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

<header>💰 Buy for Points</header>

<div class="points-display">
  Your Points: <span id="points">0</span>
</div>

<div class="container" id="itemsContainer">
  <!-- Items will be dynamically added here -->
</div>
<div style="text-align: center; margin: 10px 0;">
  <button onclick="goBack()" style="padding: 10px 20px; background-color: #1b5e20; color: white; border: none; border-radius: 8px; cursor: pointer;">
    ⬅ Back to Home
  </button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCX2O4EFo1U6QYAlybBHJC-UqMAEqCtyDs",
  authDomain: "plastic-waste-management-b4db5.firebaseapp.com",
  databaseURL: "https://plastic-waste-management-b4db5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "plastic-waste-management-b4db5",
  storageBucket: "plastic-waste-management-b4db5.firebasestorage.app",
  messagingSenderId: "1048380462925",
  appId: "1:1048380462925:web:824ff7306ab3382793c904"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const pointsPerKg = 100;
let currentUser = null;

// Ensure user is logged in
auth.onAuthStateChanged(user => {
  if (!user) {
    window.location.href = "login.html";
  } else {
    currentUser = user;
    renderItems();
    updatePointsDisplay();
  }
});

// Render items (unchanged)
function renderItems() {
  const container = document.getElementById('itemsContainer');
  container.innerHTML = "";   // Clear first to avoid duplicates

  const items = [
    {name: "Wooden Spoon", price: 500, img: "https://m.media-amazon.com/images/I/71tvwbASp6L._AC_SL1500_.jpg"},
    {name: "Wooden Plate", price: 1500, img: "https://beruru.com/cdn/shop/files/YUV8401.jpg?v=1755457116&width=1080"},
    {name: "Wooden Bowl", price: 1200, img: "https://m.media-amazon.com/images/I/71fleT8-4LL._AC_SL1500_.jpg"},
    {name: "Wooden Vessel", price: 2000, img: "https://shop.gaatha.com/image/catalog/Sankhla-Design/11_11_2021/Sankhla-%E2%9C%BC-Wooden-Burmese-Bowl-Set-of-two-%E2%9C%BC-2.jpg"}
  ];

  items.forEach(item => {
    const card = document.createElement('div');
    card.className = "item-card";
    card.innerHTML = `
      <img src="${item.img}" alt="${item.name}">
      <h4>${item.name}</h4>
      <p>Price: ${item.price} Points</p>
      <button class="buy-btn" onclick="buyItem('${item.name}', ${item.price})">Buy</button>
    `;
    container.appendChild(card);
  });
}

// FIXED: Simple & Reliable getTotalPoints
async function getTotalPoints() {
  if (!currentUser) return 0;

  try {
    // Try to read from users collection first (where index.html saves points)
    const userDoc = await db.collection("users").doc(currentUser.uid).get();
    
    if (userDoc.exists && typeof userDoc.data().points === "number") {
      return userDoc.data().points;
    }

    // Fallback: Calculate from scratch
    let total = 0;

    const plasticSnap = await db.collection("plasticData")
      .where("uid", "==", currentUser.uid).get();
    plasticSnap.forEach(doc => {
      total += (doc.data().amount || 0) * pointsPerKg;
    });

    const purchaseSnap = await db.collection("purchases")
      .where("uid", "==", currentUser.uid).get();
    purchaseSnap.forEach(doc => {
      total -= (doc.data().price || 0);
    });

    // Save the calculated value so next time it's fast
    await db.collection("users").doc(currentUser.uid).set({
      points: total,
      email: currentUser.email || "",
      lastUpdated: new Date()
    }, { merge: true });

    return total;
  } catch (err) {
    console.error("Error in getTotalPoints:", err);
    return 0;
  }
}

// Update display
async function updatePointsDisplay() {
  const points = await getTotalPoints();
  document.getElementById("points").innerText = points;
}

// FIXED: Buy item
async function buyItem(itemName, price) {
  const currentPoints = await getTotalPoints();

  if (currentPoints < price) {
    alert(`❌ Not enough points!\nYou have only ${currentPoints} points.`);
    return;
  }

  try {
    // Record purchase
    await db.collection("purchases").add({
      uid: currentUser.uid,
      item: itemName,
      price: price,
      time: new Date()
    });

    // Update points safely (without increment to avoid compat issues)
    const newPoints = currentPoints - price;
    await db.collection("users").doc(currentUser.uid).set({
      points: newPoints,
      email: currentUser.email || "",
      lastUpdated: new Date()
    }, { merge: true });

    alert(`✅ Purchased ${itemName} for ${price} points!\nRemaining: ${newPoints}`);

    updatePointsDisplay();   // Refresh immediately
    

  } 
  
  catch (err) {
    console.error("Buy error:", err);
    alert("❌ Purchase failed. Try again.");
  }
}
function goBack() {
  window.location.href = "index.html";
}
</script>

</body>
</html>
