<!DOCTYPE html>
<html>
<head>
  <title>Near Location</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f4f9f4;
      color: #1b5e20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    header {
      width: 100%;
      background-color: #1b5e20;
      color: white;
      text-align: center;
      font-family: 'Montserrat', sans-serif;
      font-size: 28px;
      padding: 20px 0;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      margin-bottom: 20px;
    }

    .hub-list {
      list-style-type: none;
      padding: 0;
      width: 100%;
      max-width: 400px;
    }

    .hub-list li {
      background-color: #e6f5ea;
      margin: 10px 0;
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      transition: 0.3s;
    }

    .hub-list li:hover {
      background-color: #c8e6c9;
      transform: translateY(-2px);
    }

    .no-hubs {
      font-size: 18px;
      font-weight: 500;
      margin-top: 30px;
      text-align: center;
    }
  </style>
</head>
<body>

<header>📍 Near Location</header>

<ul class="hub-list" id="hubList">
  <!-- Hardcoded placeholder hubs -->
  <li onclick="goToHub('hub1')">Hub 1 - Tambram</li>
  <li onclick="goToHub('hub2')">Hub 2 - pallavaram</li>
  <li onclick="goToHub('hub3')">Hub 3 - Royapuram</li>
</ul>

<p class="no-hubs" id="noHubs" style="display:none;">No hubs near you yet.</p>

<script>
  function goToHub(hubId) {
    // Placeholder: alert for now
    alert("You clicked " + hubId + ". Real navigation will be added after hub is built.");
  }

  // Example: If no hubs exist
  const hubsExist = true; // change to false to test
  if (!hubsExist) {
    document.getElementById('hubList').style.display = 'none';
    document.getElementById('noHubs').style.display = 'block';
  }
</script>

</body>
</html>
