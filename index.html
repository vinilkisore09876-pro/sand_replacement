<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECOBIN</title>
  
  <!-- Favicon (Fixed) -->
  <link rel="icon" type="image/x-icon" href="company.png">
  
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght@500&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f4f9f4;
      color: #1b5e20;
      margin: 0;
      padding: 0;
    }

    header {
      width: 100%;
      background-color: #1b5e20;
      color: #fff;
      text-align: center;
      font-family: 'Montserrat', sans-serif;
      font-size: 32px;
      padding: 15px 0;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .container {
      width: 90%;
      max-width: 600px;
      background-color: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin: 40px auto;
      text-align: center;
    }

    input[type="text"], 
    input[type="number"] {
      width: 80%;
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #c1e1c1;
      font-size: 16px;
      outline: none;
      box-sizing: border-box;
    }

    input[type="text"]:focus, 
    input[type="number"]:focus {
      border-color: #1b5e20;
      box-shadow: 0 0 8px rgba(27,94,32,0.3);
    }

    button {
      padding: 12px 25px;
      margin: 10px 5px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background-color: #1b5e20;
      color: white;
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #2e7d32;
      transform: translateY(-2px);
    }

    a {
      color: #1b5e20;
      font-weight: 500;
      text-decoration: none;
      transition: 0.3s;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Side Panel */
    .side-panel {
      height: 100%;
      width: 0;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #e6f5ea;
      overflow-x: hidden;
      transition: 0.3s;
      padding-top: 60px;
      box-shadow: 2px 0 12px rgba(0,0,0,0.2);
      z-index: 1000;
    }

    .side-panel ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .side-panel li {
      padding: 15px 30px;
      font-family: 'Montserrat', sans-serif;
      font-size: 18px;
      font-weight: 500;
      color: #1b5e20;
      cursor: pointer;
      transition: 0.3s;
      border-bottom: 1px solid #c1e1c1;
    }

    .side-panel li:hover {
      background-color: #c1e1c1;
      transform: translateX(5px);
    }

    /* Overlay */
    .overlay {
      position: fixed;
      display: none;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.3);
      z-index: 500;
    }
  </style>
</head>
<body>

<header>
  <div style="display: flex; align-items: center; justify-content: center; gap: 12px;">
    <img src="logo.jpg" 
         alt="EcoBin Logo" 
         style="height: 60px; width: auto; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));">
    <h1 style="margin: 0; font-size: 32px; font-weight: 700;">
      EcoBin
    </h1>
  </div>
</header>

<div class="container">
  <h3 id="welcome">Welcome!</h3>

  <input type="text" id="name" placeholder="Enter your name"><br>
  <input type="number" id="amount" placeholder="Plastic (kg)" min="0"><br>

  <button onclick="submitPlastic()">Submit Plastic</button>
  <button onclick="openDashboard()">📊 Dashboard</button>
  <button onclick="goToPage('history.html')">📝 Transaction History</button>
</div>

<!-- Side Panel Menu -->
<div class="side-panel" id="sidePanel">
  <ul>
    <li onclick="goToPage('nearLocation.html')">📍 Near Location</li>
    <li onclick="goToPage('vehicleStatus.html')">🚚 Vehicle Status</li>
    <li onclick="goToPage('yourLocation.html')">🧭 Your Location</li>
    <li onclick="goToPage('redeemPoints.html')">💎 Redeem Points</li>
    <li onclick="goToPage('plasticPicture.html')">📸 Picture of Plastic</li>
    <li onclick="goToPage('buyPoints.html')">💰 Buy for Points</li> 
    <li onclick="goToPage('jobs.html')">💼 Jobs</li>
    <li onclick="logout()">❌ Logout</li>
  </ul>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay" onclick="closeDashboard()"></div>

<!-- Firebase Scripts -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>

<script>
// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyCX2O4EFo1U6QYAlybBHJC-UqMAEqCtyDs",
  authDomain: "plastic-waste-management-b4db5.firebaseapp.com",
  databaseURL: "https://plastic-waste-management-b4db5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "plastic-waste-management-b4db5",
  storageBucket: "plastic-waste-management-b4db5.firebasestorage.app",
  messagingSenderId: "1048380462925",
  appId: "1:1048380462925:web:824ff7306ab3382793c904"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();
const pointsPerKg = 100;
let currentUser = null;

// Auth State Listener
auth.onAuthStateChanged(user => {
  if (!user) {
    window.location.href = "login.html";
  } else {
    currentUser = user;
    document.getElementById("welcome").innerText = `Welcome ${user.email} 👤`;
  }
});

// Add Transaction Function
async function addTransaction(type, details, kg = 0, pointsChange = 0) {
  if (!currentUser) return;
  
  try {
    await db.collection("transactions").add({
      uid: currentUser.uid,
      type: type,
      details: details,
      kg: kg,
      pointsChange: pointsChange,
      time: new Date()
    });
  } catch (error) {
    console.error("Transaction Error:", error);
  }
}

// Submit Plastic Function
async function submitPlastic() {
  const name = document.getElementById("name").value.trim();
  const amountStr = document.getElementById("amount").value.trim();
  const amount = parseFloat(amountStr);

  if (!name || isNaN(amount) || amount <= 0) {
    alert("❌ Please enter valid name and plastic amount (kg)!");
    return;
  }

  if (!currentUser) {
    alert("❌ You are not logged in!");
    window.location.href = "login.html";
    return;
  }

  const pointsEarned = Math.round(amount * pointsPerKg);

  try {
    // Save plastic data
    await db.collection("plasticData").add({
      uid: currentUser.uid,
      name: name,
      amount: amount,
      email: currentUser.email,
      time: new Date()
    });

    // Update user points
    const userRef = db.collection("users").doc(currentUser.uid);
    await userRef.set({
      points: firebase.firestore.FieldValue.increment(pointsEarned),
      email: currentUser.email,
      lastUpdated: new Date()
    }, { merge: true });

    // Add to transaction history
    await addTransaction("plastic", name, amount, pointsEarned);

    alert(`✅ Plastic submitted successfully!\nYou earned +${pointsEarned} points.`);

    // Clear inputs
    document.getElementById("name").value = "";
    document.getElementById("amount").value = "";

  } catch (error) {
    console.error("Submit Plastic Error:", error);
    alert("❌ Failed to submit plastic. Please try again.");
  }
}

// Side Panel Functions
function openDashboard() {
  document.getElementById("sidePanel").style.width = "250px";
  document.getElementById("overlay").style.display = "block";
}

function closeDashboard() {
  document.getElementById("sidePanel").style.width = "0";
  document.getElementById("overlay").style.display = "none";
}

function goToPage(url) {
  if (!url) return;
  window.location.href = url;   // Simplified - no need for "./"
}

function logout() {
  auth.signOut().then(() => {
    window.location.href = "login.html";
  }).catch(err => {
    console.error(err);
    alert("Logout failed");
  });
}
</script>

</body>
</html>
