<!DOCTYPE html>
<html>
<head>
  <title>Picture of Plastic</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f4f9f4;
      color: #1b5e20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    header {
      width: 100%;
      background-color: #1b5e20;
      color: white;
      text-align: center;
      font-family: 'Montserrat', sans-serif;
      font-size: 28px;
      padding: 20px 0;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      margin-bottom: 20px;
    }

    video, img {
      width: 90%;
      max-width: 400px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    button {
      padding: 12px 25px;
      margin: 5px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background-color: #1b5e20;
      color: white;
      transition: 0.3s;
    }

    button:hover {
      background-color: #2e7d32;
      transform: translateY(-2px);
    }

    #status {
      margin-top: 15px;
      font-weight: 500;
    }
  </style>
</head>
<body>

<header>📸 Picture of Plastic</header>

<video id="camera" autoplay playsinline></video>
<img id="photoPreview" style="display:none;" />
<br>
<button id="captureBtn">Capture Photo</button>
<button id="uploadBtn" style="display:none;">Upload Photo</button>

<p id="status"></p>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCX2O4EFo1U6QYAlybBHJC-UqMAEqCtyDs",
  authDomain: "plastic-waste-management-b4db5.firebaseapp.com",
  databaseURL: "https://plastic-waste-management-b4db5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "plastic-waste-management-b4db5",
  storageBucket: "plastic-waste-management-b4db5.firebasestorage.app",
  messagingSenderId: "1048380462925",
  appId: "1:1048380462925:web:824ff7306ab3382793c904"
};
firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

let currentUser = null;

// Ensure user is logged in
auth.onAuthStateChanged(user => {
  if (!user) {
    window.location.href = "login.html";
  } else {
    currentUser = user;
  }
});

// Camera setup
const video = document.getElementById('camera');
const photoPreview = document.getElementById('photoPreview');
const captureBtn = document.getElementById('captureBtn');
const uploadBtn = document.getElementById('uploadBtn');
const statusText = document.getElementById('status');

navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
.then(stream => {
  video.srcObject = stream;
})
.catch(err => {
  console.error("Camera not accessible:", err);
  statusText.innerText = "Camera not accessible on this device.";
});

// Capture photo
let capturedBlob = null;
captureBtn.addEventListener('click', () => {
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(blob => {
    capturedBlob = blob;
    photoPreview.src = URL.createObjectURL(blob);
    photoPreview.style.display = 'block';
    uploadBtn.style.display = 'inline-block';
    statusText.innerText = "Photo captured! Ready to upload.";
  }, 'image/jpeg');
});

// Upload photo
uploadBtn.addEventListener('click', () => {
  if (!capturedBlob || !currentUser) return;
  const storageRef = storage.ref().child(`plasticPhotos/${currentUser.uid}_${Date.now()}.jpg`);
  const uploadTask = storageRef.put(capturedBlob);

  statusText.innerText = "Uploading photo...";

  uploadTask.on('state_changed', 
    snapshot => {},
    error => {
      console.error(error);
      statusText.innerText = "Upload failed!";
    },
    () => {
      uploadTask.snapshot.ref.getDownloadURL().then(url => {
        db.collection("plasticPhotos").add({
          uid: currentUser.uid,
          url: url,
          time: new Date()
        });
        statusText.innerText = "Photo uploaded successfully!";
        capturedBlob = null;
        uploadBtn.style.display = 'none';
      });
    }
  );
});
</script>

</body>
</html>
